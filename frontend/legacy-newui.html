<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workflow Studio</title>
    <link rel="icon" type="image/svg+xml" href="/wfm_static/favicon.svg">
    <link rel="stylesheet" href="/wfm_static/css/newui/newui.css">
    <!-- Inline, not a module, on purpose: it must run before first paint, and the
         attribute swap is what theme-m3.css keys off (no flash of the wrong theme). -->
    <script>
        try {
            var nuTheme = JSON.parse(localStorage.getItem("nu_theme") || '"m3-dark"');
            document.documentElement.dataset.theme = nuTheme === "m3-light" ? "m3-light" : "m3-dark";
        } catch (err) { document.documentElement.dataset.theme = "m3-dark"; }
    </script>
</head>
<body class="nu-body">
    <!-- Top app bar: __leading is reserved (logo/menu), __title carries the active
         view's name (kept in sync by main.js), __trailing hosts the connection badge. -->
    <header class="m3-top-app-bar">
        <div class="m3-top-app-bar__leading"></div>
        <h1 class="m3-top-app-bar__title">Workflow</h1>
        <div class="m3-top-app-bar__trailing"></div>
    </header>

    <!-- The rail ships empty: the six items (brief §5) carry i18n labels and
         active state, so main.js builds them. `#nu-view-root` is the only id in
         this shell — everything else hooks onto .m3-* / .nu-* classes. -->
    <nav class="m3-navigation-rail" aria-label="Main navigation">
        <noscript>This interface needs JavaScript. <a href="/wfm">Open the classic UI</a> instead.</noscript>
    </nav>

    <main class="nu-main" id="nu-view-root"></main>

    <div class="m3-snackbar-host"></div>
    <div class="m3-dialog-host"></div>

    <script type="module" src="/wfm_static/js/newui/main.js"></script>
</body>
</html>
