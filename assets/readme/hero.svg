<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ComfyUI-Workflow-Studio — fork build</title>
  <desc id="hero-desc">A storyboard page of score tags and caption text is parsed, matched against 34 self-trained LoRA rules, injected as measured weights through a cascade of CR LoRA Stack nodes, and rendered by a remote RTX 3090 running an Anima W8A8 INT8 UNet, with the finished images returned to the local machine.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131a2e"/>
      <stop offset="55%" stop-color="#18223c"/>
      <stop offset="100%" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#7b68ee"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2b4d"/>
      <stop offset="100%" stop-color="#1a2440"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>

  <!-- recurring motif: the W+S wave from assets/banner.svg -->
  <g id="motif" opacity="0.5">
    <path d="M0 392 C 130 344, 250 420, 380 380 C 500 344, 610 402, 720 372"
          fill="none" stroke="url(#wave)" stroke-width="2.5" stroke-opacity="0.55"/>
    <path d="M0 410 C 150 372, 270 430, 410 396 C 540 366, 640 414, 740 388"
          fill="none" stroke="url(#wave)" stroke-width="1.5" stroke-opacity="0.3"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <text x="64" y="82" fill="#98a3c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" letter-spacing="3">COMFYUI CUSTOM NODE · FORK</text>
    <g id="cn-tag">
      <rect x="496" y="60" width="118" height="32" rx="16" fill="none" stroke="#4a9eff" stroke-opacity="0.6"/>
      <text x="555" y="82" fill="#7fb8ff" font-size="18" text-anchor="middle">分镜工作台</text>
    </g>

    <text x="64" y="142" fill="#eef2ff" font-size="54" font-weight="700">Workflow Studio</text>
    <text x="64" y="190" fill="#dfe6ff" font-size="24">Storyboard text in. Matched self-trained LoRAs,</text>
    <text x="64" y="222" fill="#dfe6ff" font-size="24">at measured weights, rendered on a remote GPU.</text>

    <text x="64" y="262" fill="#b6c1e4" font-size="21">把分镜页文本直接变成成图：自动匹配自训 LoRA 精确权重，</text>
    <text x="64" y="292" fill="#b6c1e4" font-size="21">经 SSH 隧道在远程 3090 上跑 Anima W8A8 INT8 出图并回传。</text>

    <text x="64" y="344" fill="#98a3c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18">upstream v0.7.11 · +71 fork commits · MIT</text>
  </g>

  <g id="proof" transform="translate(690 0)">
    <!-- 01 storyboard page specimen -->
    <g id="card-page">
      <rect x="0" y="48" width="446" height="134" rx="16" fill="url(#chip)" stroke="#2b3a63"/>
      <rect x="0" y="48" width="4" height="134" rx="2" fill="#4a9eff"/>
      <text x="24" y="76" fill="#98a3c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">01 · pages/NN002….txt</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <text x="24" y="106" fill="#7fb8ff">[tags]</text>
        <text x="24" y="132" fill="#dfe6ff">1girl, liino (arknights), (white</text>
        <text x="24" y="158" fill="#dfe6ff">stirrup legwear:1.3), ustirrup</text>
      </g>
    </g>

    <!-- 02 matched LoRA chips -->
    <g id="card-match">
      <rect x="0" y="200" width="446" height="112" rx="16" fill="url(#chip)" stroke="#2b3a63"/>
      <rect x="0" y="200" width="4" height="112" rx="2" fill="#7b68ee"/>
      <text x="24" y="228" fill="#98a3c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">02 · 34 rules → 8 LoRA → 3 stacks</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
        <rect x="24" y="248" width="132" height="42" rx="10" fill="#232f55"/>
        <text x="90" y="275" fill="#cfe0ff" text-anchor="middle">lino_v2 1.10</text>
        <rect x="166" y="248" width="152" height="42" rx="10" fill="#232f55"/>
        <text x="242" y="275" fill="#cfe0ff" text-anchor="middle">ustirrup 1.20</text>
        <rect x="328" y="248" width="92" height="42" rx="10" fill="#232f55"/>
        <text x="374" y="275" fill="#98a3c8" text-anchor="middle">+6 more</text>
      </g>
    </g>

    <!-- 03 remote render -->
    <g id="card-render">
      <rect x="0" y="330" width="446" height="62" rx="16" fill="url(#chip)" stroke="#2b3a63"/>
      <rect x="0" y="330" width="4" height="62" rx="2" fill="#4a9eff"/>
      <text x="24" y="356" fill="#98a3c8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">03 · win30902 · OTUnetLoaderW8A8</text>
      <text x="24" y="380" fill="#dfe6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18">POST /prompt → /ws → PNG back to Mac</text>
    </g>
  </g>
</svg>
